#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4.5
    with:
      duckdb_version: v1.4.5
      ci_tools_version: v1.4.5
      extension_name: aes_tools
      vcpkg_commit: 319504a5326aa870edde46438c5455fa76305a56

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.4.5
    with:
      duckdb_version: v1.4.5
      ci_tools_version: v1.4.5
      extension_name: aes_tools
      format_checks: 'format;tidy'
